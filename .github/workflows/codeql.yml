name: CodeQL

# Static analysis for the JavaScript/TypeScript in both apps. Runs on PRs so a
# newly introduced injection or auth flaw is caught in review, and weekly so
# newly published rules are applied to code that has not changed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended, not security-and-quality. The quality suite adds
          # style rules (unused variables, redundant expressions) that produced
          # ~70 alerts on the first run and would bury real findings — a check
          # that is always red gets ignored. Extended keeps the deeper security
          # queries without the style noise.
          queries: security-extended

      # No build step: CodeQL analyses JS/TS from source, and building here would
      # only duplicate the build job in deploy.yml.
      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          output: sarif-results

      # The "CodeQL" check reports only a severity count ("1 high"), and the rule
      # behind it is readable only in the Security tab. That is fine in a browser
      # and useless from anywhere else — CI, a terminal, a review bot. Printing
      # each finding here makes a red run self-describing from the job log alone.
      - name: Print findings
        if: always()
        run: |
          shopt -s nullglob
          for f in sarif-results/*.sarif; do
            echo "=== $f ==="
            echo "result count: $(jq '[.runs[].results[]?] | length' "$f")"
            # Rule metadata lives under tool.extensions[].rules for CodeQL query
            # packs and only sometimes under tool.driver.rules, so the severity
            # lookup is built from both — and a rule missing from it must still
            # not suppress the finding itself.
            jq -r '
              . as $doc
              | ([ $doc.runs[].tool
                   | (.driver.rules[]?), (.extensions[]?.rules[]?) ]
                 | map({key: .id, value: (.properties["security-severity"] // "n/a")})
                 | from_entries) as $sev
              | $doc.runs[].results[]?
              | "[\($sev[.ruleId] // "n/a")] \(.ruleId)\n" +
                "  \(.locations[0].physicalLocation.artifactLocation.uri // "?"):" +
                "\(.locations[0].physicalLocation.region.startLine // 0)\n" +
                "  \(.message.text)"
            ' "$f"
          done
