name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Production migrations are a manual step (see VERCEL.md): Vercel's build runs
  # `prisma generate` only, so merging a migration ships code that expects
  # columns the database does not have. This job reports whether production is
  # actually up to date, so that gap is visible on the PR instead of surfacing
  # later as `The column X does not exist in the current database`.
  #
  # Requires the MIGRATE_DATABASE_URL secret: the Supabase *session* pooler
  # string (port 5432 — the transaction pooler on 6543 cannot run migrations).
  # Without the secret the job warns loudly and passes, so forks and outside
  # contributors are not blocked — but the run is clearly marked as having
  # verified nothing, rather than looking like a real green check.
  migrations:
    name: Migration status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atg_backend/package-lock.json

      - name: Install backend dependencies
        working-directory: atg_backend
        run: npm ci

      - name: Check production migration status
        working-directory: atg_backend
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            # A warning, not a notice, and repeated in the job summary: this job
            # has been passing without checking anything, and a green tick that
            # verifies nothing is worse than no check at all — production can
            # drift behind the migrations here and nothing says so. Every query
            # touching the missing table or column then answers 500.
            echo "::warning title=Migration check skipped::MIGRATE_DATABASE_URL is not set, so production migrations were NOT verified. This check passed without checking anything."
            {
              echo "### ⚠️ Migration status not verified"
              echo
              echo "\`MIGRATE_DATABASE_URL\` is not set, so this job passed **without checking production**."
              echo "Set it to the Supabase *session* pooler string (port 5432 — the transaction"
              echo "pooler on 6543 cannot run migrations) to make this check real."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # `migrate status` exits non-zero when migrations are pending, which
          # is exactly the condition worth failing the PR on.
          npx prisma migrate status

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::Production has unapplied migrations."
          echo "Apply them before merging (see VERCEL.md):"
          echo "  cd atg_backend"
          echo "  DATABASE_URL=\"<session-pooler-string>\" npx prisma migrate deploy"

  # Runs before build/deploy so a red suite blocks the deploy. Needs no database:
  # the API suites drive Express through supertest with the Prisma client mocked.
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atg_backend/package-lock.json

      - name: Install backend dependencies
        working-directory: atg_backend
        run: npm ci

      - name: Run tests
        working-directory: atg_backend
        run: npm test

      - name: Audit backend dependencies
        working-directory: atg_backend
        # Advisory: reports known vulnerabilities without failing the build on a
        # transitive advisory nobody can act on today.
        continue-on-error: true
        run: npm audit --audit-level=high

  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            atg_backend/package-lock.json
            atg_frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: atg_backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: atg_backend
        run: npx prisma generate

      - name: Install frontend dependencies
        working-directory: atg_frontend
        run: npm ci

      - name: Lint frontend
        working-directory: atg_frontend
        run: npm run lint

      - name: Build frontend
        working-directory: atg_frontend
        env:
          VITE_API_URL: https://placeholder.invalid/api
          # Vite inlines these at build time, so a build without them ships a
          # frontend whose social sign-in buttons never appear.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
          VITE_MICROSOFT_TENANT_ID: ${{ secrets.VITE_MICROSOFT_TENANT_ID }}
        run: npm run build

# There is deliberately no deploy job here. Production deploys are driven by the
# Vercel (backend) and Cloudflare (frontend) git integrations, so this workflow
# only gates merges.
#
# A "Deploy to VPS" job used to live here: it SSHed into a MariaDB/docker-compose
# host that was retired when the stack moved to Supabase + Vercel + Cloudflare,
# and it ran `db:seed` on every push to main. `prisma/seed.js` creates accounts
# with a password published in the repo, so that job was one live DEPLOY_HOST
# secret away from seeding those accounts into a real database. It was removed
# rather than fixed, because nothing it deployed to exists any more.
