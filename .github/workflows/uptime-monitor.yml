name: Uptime monitor

# Deploys ops/uptime-monitor to Cloudflare and then proves it works, so the
# monitor is never "deployed but unverified".
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token with "Workers Scripts: Edit" and
#                           "Workers KV Storage: Edit" on the account
#   ALERT_WEBHOOK_URL     — Slack or Discord incoming webhook (optional, but
#                           without it the monitor has nowhere to send alerts)
#
# Without CLOUDFLARE_API_TOKEN every run skips with a warning rather than
# failing, so forks and PRs from contributors are not blocked.

on:
  push:
    branches: [main]
    paths: ["ops/uptime-monitor/**", ".github/workflows/uptime-monitor.yml"]
  workflow_dispatch:

concurrency:
  group: uptime-monitor-deploy
  cancel-in-progress: false

env:
  # Not a secret: it is the account id already visible in Cloudflare dashboard links.
  CLOUDFLARE_ACCOUNT_ID: 467622770588fbc9d872cb35762775f4
  MONITOR_URL: https://atg-uptime-monitor.remoraj4.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/uptime-monitor
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set — the uptime monitor was NOT deployed. See the header of this workflow."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ops/uptime-monitor/package-lock.json

      - name: Install
        if: steps.creds.outputs.ok == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.creds.outputs.ok == 'true'
        run: npm run typecheck

      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Set alert webhook
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "::warning::ALERT_WEBHOOK_URL is not set — the monitor runs and logs, but cannot alert anyone."
          else
            printf '%s' "$ALERT_WEBHOOK_URL" | npx wrangler secret put ALERT_WEBHOOK_URL
          fi

      # The monitor's fetch handler runs one real check on demand. 200 means it
      # reached the API and saw a healthy answer; 503 means the monitor works
      # and the API is down — worth knowing, but not a failed deploy.
      - name: Verify the deployed monitor
        if: steps.creds.outputs.ok == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o body.json -w '%{http_code}' "$MONITOR_URL" || echo 000)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then break; fi
            echo "attempt $i: HTTP $code, waiting for the deploy to propagate"; sleep 10
          done
          echo "Monitor answered HTTP $code:"; cat body.json; echo
          case "$code" in
            200) echo "Monitor deployed and the API is healthy." ;;
            503) echo "::warning::Monitor deployed, but it reports the API as DOWN." ;;
            *)   echo "::error::Monitor did not answer after deploy (HTTP $code)."; exit 1 ;;
          esac
