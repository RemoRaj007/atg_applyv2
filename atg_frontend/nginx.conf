server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index atg_index.html;

    # React Router client-side routing: fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /atg_index.html;
    }

    # Long-lived caching for fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
